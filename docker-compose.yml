services:
  cms-user-management-service:
    image: cms-user-management-service:latest
    container_name: cms-user-management-service
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    ports:
      - "8093:8093"
    networks:
      - educareNetwork
    healthcheck:
      test: wget -qO- http://localhost:8093/health || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  educareNetwork:
    external: true
